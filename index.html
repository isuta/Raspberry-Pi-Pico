<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pico2W LED 点滅速度制御</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: sans-serif;
      background-color: #f0f0f0;
      color: #333;
      height: 100vh;
      width: 100vw;
      overflow: hidden;
    }
    .container {
      width: 100%;
      height: 100%;
      background: #fff;
      padding: 16px;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
    }
    h1 {
      font-size: 1.4em;
      margin: 0 0 12px 0;
      text-align: center;
    }
    .slider-group {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      margin: 20px 0;
      position: relative;
    }
    .slider-scale {
      position: absolute;
      left: 50%;
      margin-left: 40px;
      height: calc(100% - 40px);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      font-size: 1.2em;
      color: #666;
    }
    .scale-mark {
      display: flex;
      align-items: center;
    }
    .scale-mark::before {
      content: '';
      width: 10px;
      height: 2px;
      background: #666;
      margin-right: 8px;
    }
    input[type="range"] {
      height: calc(100% - 40px);
      width: 32px;
      writing-mode: bt-lr; /* IE */
      -webkit-appearance: slider-vertical; /* WebKit */
      appearance: slider-vertical;
    }
    .limiter-overlay {
      position: absolute;
      left: 50%;
      transform: translateX(-16px);
      width: 32px;
      top: 0;
      height: 54.17%;
      background: rgba(200, 200, 200, 0.6);
      pointer-events: none;
      display: none;
    }
    .limiter-overlay.active {
      display: block;
    }
    .limiter-label {
      position: absolute;
      left: 50%;
      margin-left: 40px;
      top: 54.17%;
      transform: translateY(-50%);
      font-size: 0.9em;
      color: #0066cc;
      white-space: nowrap;
    }
    .voltage-label {
      font-size: 0.8em;
      color: #ff0000;
      margin-left: 4px;
    }
    .limiter-control {
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 10px 0;
      font-size: 1.1em;
    }
    .limiter-control input[type="checkbox"] {
      margin-right: 8px;
      width: 20px;
      height: 20px;
    }
    .limiter-control label {
      cursor: pointer;
    }
    .value-display {
      font-size: 1.2em;
      text-align: center;
      margin-top: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }
    .value-input {
      width: 80px;
      font-size: 1.2em;
      text-align: center;
      padding: 4px;
      border: 2px solid #ccc;
      border-radius: 4px;
    }
    .value-input.max-display {
      color: #ff0000;
      font-weight: bold;
      border-color: #ff0000;
    }
    .max-label {
      color: #ff0000;
      font-weight: bold;
      font-size: 1.5em;
      display: none;
    }
    .max-label.active {
      display: inline;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Pico2W 速度制御</h1>
    <div class="limiter-control">
      <input type="checkbox" id="limiter" checked onchange="toggleLimiter(this.checked)">
      <label for="limiter">リミッター</label>
    </div>
    <p class="value-display">出力値: <input type="number" id="valDisplay" class="value-input" value="0" min="0" max="100" oninput="updateFromInput(this.value)" /><span id="maxLabel" class="max-label">MAX!!!</span></p>
    <div class="slider-group">
      <input type="range" id="slider" min="0" max="100" value="0"
             oninput="updateValue(this.value)" />
      <div class="limiter-overlay" id="limiterOverlay"></div>
      <div class="limiter-label" id="limiterLabel">リミッター 3.3V/46%</div>
      <div class="slider-scale">
        <div class="scale-mark">100<span class="voltage-label" id="maxVoltage"></span></div>
        <div class="scale-mark">90</div>
        <div class="scale-mark">80</div>
        <div class="scale-mark">70</div>
        <div class="scale-mark">60</div>
        <div class="scale-mark">50</div>
        <div class="scale-mark">40</div>
        <div class="scale-mark">30</div>
        <div class="scale-mark">20</div>
        <div class="scale-mark">10</div>
        <div class="scale-mark">0</div>
      </div>
    </div>
    <script>
      const MAX_LIMIT = 46; // リミッター有効時の上限値(3.3V相当)
      let limiterEnabled = true; // デフォルトでリミッター有効
      
      // ページ読み込み時にリミッターを有効化
      window.onload = function() {
        toggleLimiter(true);
      };
      
      function updateValue(val) {
        // リミッター有効時は上限チェック
        if (limiterEnabled && val > MAX_LIMIT) {
          val = MAX_LIMIT;
          document.getElementById('slider').value = val;
        }
        
        const valDisplay = document.getElementById('valDisplay');
        const maxLabel = document.getElementById('maxLabel');
        
        // 値を設定
        valDisplay.value = val;
        
        // 100のときは赤色太字 + MAX!!!表示
        if (val == 100) {
          valDisplay.className = 'value-input max-display';
          maxLabel.className = 'max-label active';
        } else {
          valDisplay.className = 'value-input';
          maxLabel.className = 'max-label';
        }
        
        var xhr = new XMLHttpRequest();
        xhr.open('GET', '/?value=' + val, true);
        xhr.send();
      }
      
      function updateFromInput(inputVal) {
        const valDisplay = document.getElementById('valDisplay');
        const maxLabel = document.getElementById('maxLabel');
        const slider = document.getElementById('slider');
        
        // 数値のみ抽出
        let val = parseInt(inputVal);
        
        // 数値チェック
        if (isNaN(val)) {
          return; // 数値でない場合は何もしない
        }
        
        // 範囲制限
        if (val < 0) val = 0;
        if (val > 100) val = 100;
        
        // リミッター有効時の上限チェック
        if (limiterEnabled && val > MAX_LIMIT) {
          val = MAX_LIMIT;
        }
        
        // スライダーを更新
        slider.value = val;
        
        // 値を設定
        valDisplay.value = val;
        
        // 100のときは赤色太字 + MAX!!!表示
        if (val == 100) {
          valDisplay.className = 'value-input max-display';
          maxLabel.className = 'max-label active';
        } else {
          valDisplay.className = 'value-input';
          maxLabel.className = 'max-label';
        }
        
        // サーバーに送信
        var xhr = new XMLHttpRequest();
        xhr.open('GET', '/?value=' + val, true);
        xhr.send();
      }
      
      function toggleLimiter(enabled) {
        limiterEnabled = enabled;
        const overlay = document.getElementById('limiterOverlay');
        const maxVoltage = document.getElementById('maxVoltage');
        const slider = document.getElementById('slider');
        
        if (enabled) {
          overlay.classList.add('active');
          maxVoltage.textContent = '';
          // 現在値がリミット超えてたら下げる
          if (parseInt(slider.value) > MAX_LIMIT) {
            slider.value = MAX_LIMIT;
            updateValue(MAX_LIMIT);
          }
        } else {
          overlay.classList.remove('active');
          maxVoltage.textContent = ' 7.2V';
        }
      }
    </script>
  </div>
</body>
</html>
